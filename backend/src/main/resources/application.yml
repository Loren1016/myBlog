server:
  port: 8080

spring:
  application:
    name: myblog-backend

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/myblog?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# JWT
app:
  jwt-secret: change-me-to-a-strong-random-secret-key
  jwt-expiration-ms: 604800000  # 7 days

# File upload
file:
  upload-dir: ./uploads
